<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Grey | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Dark Theme (Default) */
            --bg: #0a0a0c;
            --surface: #1a1a20;
            --primary: #00a8ff; /* New Blue Theme */
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a35;
            --input-bg: #0a0a0c;
            --danger-bg: rgba(255,68,68,0.1);
            --danger-text: #ff4444;
            --font-main: 'Segoe UI', system-ui, sans-serif;
            --sidebar-width: 260px;
        }

        [data-theme="light"] {
            /* Light Theme */
            --bg: #f0f2f5;
            --surface: #ffffff;
            --primary: #0056b3; 
            --text-main: #1c1e21;
            --text-muted: #606770;
            --border-color: #ccd0d5;
            --input-bg: #ffffff;
            --danger-bg: #ffebee;
            --danger-text: #d32f2f;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg); color: var(--text-main); font-family: var(--font-main);
            overflow-x: hidden; transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar Styles */
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100vh; width: var(--sidebar-width);
            background-color: var(--surface); padding: 35px 25px; border-right: 1px solid var(--border-color);
            z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s, border-color 0.3s;
            box-shadow: 5px 0 25px rgba(0,0,0,0.1);
        }
        
        .sidebar.collapsed { transform: translateX(-100%); }

        .sidebar h2 { margin-top: 0; color: var(--primary); font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase;}
        .sidebar-menu { list-style: none; padding: 0; margin-top: 40px; }
        .sidebar-menu li { margin-bottom: 20px; }
        .sidebar-menu a { color: var(--text-muted); text-decoration: none; font-size: 1.1rem; transition: 0.3s; display: flex; align-items: center; gap: 12px;}
        .sidebar-menu a:hover, .sidebar-menu a.active { color: var(--text-main); }
        .sidebar-menu a.active i { color: var(--primary); }
        
        /* Main Content Layout */
        .main-content { 
            margin-left: var(--sidebar-width); padding: 40px 50px; 
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); min-height: 100vh;
        }
        .main-content.expanded { margin-left: 0; padding: 40px 50px; }

        /* Top Navigation & Hamburger Menu */
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding-bottom: 10px; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        
        .btn-icon {
            display: flex; align-items: center; justify-content: center;
            background: var(--surface); border: 1px solid var(--border-color);
            color: var(--text-main); font-size: 1.2rem; padding: 10px 14px;
            border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .btn-icon:hover { color: var(--primary); border-color: var(--primary); }

        /* Breadcrumb Navigation */
        .breadcrumb { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; color: var(--text-muted); }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; transition: color 0.3s; display: flex; align-items: center; gap: 6px; }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb .separator { font-size: 0.75rem; color: var(--text-muted); }
        .breadcrumb .current { color: var(--text-main); font-weight: 600; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;}
        .header h1 { margin: 0; font-size: 2.2rem; }
        
        /* Dashboard Components */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 35px; }
        .stat-card { background: var(--surface); padding: 25px; border-radius: 12px; border-left: 4px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s;}
        .stat-title { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
        .stat-value { font-size: 2.4rem; font-weight: bold; margin: 0; }
        
        .card { background: var(--surface); border-radius: 12px; padding: 30px; margin-bottom: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s;}
        .card h3 { margin-top: 0; margin-bottom: 25px; color: var(--text-main); border-left: 3px solid var(--primary); padding-left: 12px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 14px; border-radius: 8px; font-family: inherit; font-size: 0.95rem; transition: 0.3s;}
        .form-group input:focus { border-color: var(--primary); outline: none; }
        
        .btn-submit { background: var(--primary); color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 20px; font-size: 0.95rem; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }

        .table-container { background: var(--surface); border-radius: 12px; overflow: hidden; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s;}
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: var(--text-muted); padding: 18px; border-bottom: 1px solid var(--border-color); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;}
        td { padding: 18px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .art-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
        .badge { background: rgba(0, 168, 255, 0.1); color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; gap: 6px;}
        .btn-delete { color: var(--danger-text); background: var(--danger-bg); border: 1px solid var(--danger-text); padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .btn-delete:hover { background: var(--danger-text); color: #fff; }

        @media (max-width: 768px) {
            .main-content, .main-content.expanded { padding: 20px; }
            .top-bar { margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <h2>DJ GREY <br><span style="color:var(--text-main); font-size: 1rem;">Admin</span></h2>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fa-solid fa-chart-pie"></i> Analytics & Upload</a></li>
            <li><a href="/" target="_blank"><i class="fa-solid fa-globe"></i> View Live Site</a></li>
            <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
    </nav>

    <main class="main-content" id="main-content">
        <!-- Top Bar with Hamburger, Breadcrumb & Theme Toggle -->
        <div class="top-bar">
            <div class="nav-left">
                <button class="btn-icon" id="hamburger-btn" aria-label="Toggle Sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <nav class="breadcrumb">
                    <a href="/"><i class="fa-solid fa-house"></i> Home</a>
                    <i class="fa-solid fa-chevron-right separator"></i>
                    <a href="#">Admin</a>
                    <i class="fa-solid fa-chevron-right separator"></i>
                    <span class="current">Dashboard</span>
                </nav>
            </div>
            
            <button class="btn-icon" id="theme-toggle" aria-label="Toggle Theme">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>

        <header class="header">
            <h1>Platform Control Center</h1>
            <p id="date-display" style="color: var(--text-muted);"></p>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Mixes</div>
                <div class="stat-value" id="total-mixes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Likes</div>
                <div class="stat-value" id="total-likes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Downloads</div>
                <div class="stat-value" id="total-downloads">0</div>
            </div>
        </div>

        <!-- Add Mix Form -->
        <div class="card">
            <h3>Publish New Mix</h3>
            <form id="add-mix-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="mix-title">Mix Title *</label>
                        <input type="text" id="mix-title" placeholder="e.g. BASHMENT TOURS #summer_vibes" required>
                    </div>
                    <div class="form-group">
                        <label for="mix-audio">Audio Link (Dropbox/Supabase) *</label>
                        <input type="url" id="mix-audio" placeholder="Paste Dropbox link here..." required>
                    </div>
                    <div class="form-group">
                        <label for="mix-artwork">Artwork Link (Optional)</label>
                        <input type="url" id="mix-artwork" placeholder="Paste Dropbox image link (or leave blank for logo)">
                    </div>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-cloud-arrow-up"></i> Publish Mix</button>
            </form>
        </div>

        <!-- Mixes Table -->
        <div class="table-container">
            <h3 style="margin-top: 0; margin-bottom: 25px;">Live Catalog</h3>
            <table>
                <thead>
                    <tr>
                        <th>Artwork</th>
                        <th>Title</th>
                        <th>Likes</th>
                        <th>Downloads</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <tr><td colspan="5">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const API_URL = 'https://dj-grey.onrender.com/api'; 

        // 1. SECURITY CHECK: Check for token immediately
        const token = localStorage.getItem('dj_grey_token');
        if (!token) {
            window.location.href = '/login.html'; // Kick unauthorized users out!
        }

        // Helper function to attach the authorization token to requests
        const getAuthHeaders = () => ({
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        });

        // Logout function
        function logout() {
            localStorage.removeItem('dj_grey_token');
            localStorage.removeItem('dj_grey_user');
            window.location.href = '/login.html';
        }

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        themeToggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            themeToggleBtn.innerHTML = theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        // Toggle Sidebar
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        });

        document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Load data into stats & table
        async function loadAdminData() {
            try {
                const res = await fetch(`${API_URL}/mixes`); // Public route, no token needed
                const mixes = await res.json();

                const tableBody = document.getElementById('admin-table-body');
                let totalLikes = 0;
                let totalDownloads = 0;

                tableBody.innerHTML = '';

                mixes.forEach(mix => {
                    totalLikes += mix.likes_count;
                    totalDownloads += mix.downloads_count;

                    tableBody.innerHTML += `
                        <tr>
                            <td><img src="${mix.artwork_url}" class="art-thumb" onerror="this.src='https://via.placeholder.com/45/1a1a20/00a8ff?text=Art'"></td>
                            <td style="font-weight: bold;">${mix.title}</td>
                            <td><span class="badge"><i class="fa-solid fa-heart"></i> ${mix.likes_count}</span></td>
                            <td><span class="badge"><i class="fa-solid fa-download"></i> ${mix.downloads_count}</span></td>
                            <td>
                                <button class="btn-delete" onclick="deleteMix(${mix.id}, '${mix.title.replace(/'/g, "\\'")}')">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('total-mixes').innerText = mixes.length;
                document.getElementById('total-likes').innerText = totalLikes;
                document.getElementById('total-downloads').innerText = totalDownloads;

            } catch (error) {
                console.error("Error loading admin data:", error);
            }
        }

        // Add mix - NOW SECURED
        document.getElementById('add-mix-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('mix-title').value;
            const audio_url = document.getElementById('mix-audio').value;
            const artwork_url = document.getElementById('mix-artwork').value;

            try {
                const res = await fetch(`${API_URL}/mixes`, {
                    method: 'POST',
                    headers: getAuthHeaders(), // <-- Sending the secure token
                    body: JSON.stringify({ title, audio_url, artwork_url })
                });

                if (res.ok) {
                    alert('Mix published successfully!');
                    document.getElementById('add-mix-form').reset();
                    loadAdminData();
                } else {
                    const data = await res.json();
                    alert(`Failed: ${data.error}`);
                    if (res.status === 401 || res.status === 403) logout(); // Kick out if token expired
                }
            } catch (err) {
                console.error("Error publishing mix:", err);
            }
        });

        // Delete mix - NOW SECURED
        async function deleteMix(id, title) {
            if (!confirm(`Are you sure you want to delete "${title}"?`)) return;

            try {
                const res = await fetch(`${API_URL}/mixes/${id}`, { 
                    method: 'DELETE',
                    headers: getAuthHeaders() // <-- Sending the secure token
                });

                if (res.ok) {
                    loadAdminData();
                } else {
                    const data = await res.json();
                    alert(`Failed: ${data.error}`);
                    if (res.status === 401 || res.status === 403) logout(); // Kick out if token expired
                }
            } catch (err) {
                console.error("Error deleting mix:", err);
            }
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
