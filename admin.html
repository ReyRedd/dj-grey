<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Grey | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #1a1a20;
            --primary: #ff0055;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --font-main: 'Segoe UI', system-ui, sans-serif;
            --sidebar-width: 260px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg); color: var(--text-light); font-family: var(--font-main);
            overflow-x: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            position: fixed; top: 0; left: 0; height: 100vh; width: var(--sidebar-width);
            background-color: var(--surface); padding: 35px 25px; border-right: 1px solid #2a2a35;
            z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
        }
        
        /* Collapsed Sidebar State */
        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar h2 { margin-top: 0; color: var(--primary); font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase;}
        .sidebar-menu { list-style: none; padding: 0; margin-top: 40px; }
        .sidebar-menu li { margin-bottom: 20px; }
        .sidebar-menu a { color: var(--text-muted); text-decoration: none; font-size: 1.1rem; transition: 0.3s; display: flex; align-items: center; gap: 12px;}
        .sidebar-menu a:hover, .sidebar-menu a.active { color: var(--text-light); }
        .sidebar-menu a.active i { color: var(--primary); }
        
        /* Main Content Layout with Spacing */
        .main-content { 
            margin-left: var(--sidebar-width); 
            padding: 40px 50px; 
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }
        
        /* Full width content with inner spacing when sidebar collapses */
        .main-content.expanded {
            margin-left: 0;
            padding: 40px 50px;
        }

        /* Top Navigation & Hamburger Menu Spacing */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .hamburger {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 1px solid #2a2a35;
            color: var(--text-light);
            font-size: 1.2rem;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .hamburger:hover { color: var(--primary); border-color: var(--primary); background: #22222a; }

        /* Breadcrumb Navigation */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb .separator { font-size: 0.75rem; color: #4a4a5a; }
        .breadcrumb .current { color: var(--text-light); font-weight: 600; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; border-bottom: 1px solid #2a2a35; padding-bottom: 20px;}
        .header h1 { margin: 0; font-size: 2.2rem; }
        
        /* Dashboard Component Spacing */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 35px; }
        .stat-card { background: var(--surface); padding: 25px; border-radius: 12px; border-left: 4px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.3);}
        .stat-title { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
        .stat-value { font-size: 2.4rem; font-weight: bold; margin: 0; }
        
        .card { background: var(--surface); border-radius: 12px; padding: 30px; margin-bottom: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card h3 { margin-top: 0; margin-bottom: 25px; color: var(--text-light); border-left: 3px solid var(--primary); padding-left: 12px; font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input { background: #0a0a0c; border: 1px solid #2a2a35; color: #fff; padding: 14px; border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
        .form-group input:focus { border-color: var(--primary); outline: none; }
        .btn-submit { background: var(--primary); color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top: 20px; font-size: 0.95rem; }
        .btn-submit:hover { box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); transform: translateY(-2px); }

        .table-container { background: var(--surface); border-radius: 12px; overflow: hidden; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: var(--text-muted); padding: 18px; border-bottom: 1px solid #2a2a35; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;}
        td { padding: 18px; border-bottom: 1px solid #2a2a35; vertical-align: middle; }
        .art-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
        .badge { background: rgba(255,0,85,0.1); color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; gap: 6px;}
        .btn-delete { color: #ff4444; background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .btn-delete:hover { background: #ff4444; color: #fff; }

        /* Responsive spacing for smaller screens */
        @media (max-width: 768px) {
            .main-content, .main-content.expanded { padding: 20px; }
            .top-bar { margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <h2>DJ GREY <br><span style="color:#fff; font-size: 1rem;">Admin</span></h2>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fa-solid fa-chart-pie"></i> Analytics & Upload</a></li>
            <li><a href="/" target="_blank"><i class="fa-solid fa-globe"></i> View Live Site</a></li>
        </ul>
    </nav>

    <main class="main-content" id="main-content">
        <!-- Top Bar with Hamburger & Breadcrumb -->
        <div class="top-bar">
            <button class="hamburger" id="hamburger-btn" aria-label="Toggle Sidebar">
                <i class="fa-solid fa-bars"></i>
            </button>
            <nav class="breadcrumb">
                <a href="/"><i class="fa-solid fa-house"></i> Home</a>
                <i class="fa-solid fa-chevron-right separator"></i>
                <a href="#">Admin</a>
                <i class="fa-solid fa-chevron-right separator"></i>
                <span class="current">Dashboard</span>
            </nav>
        </div>

        <header class="header">
            <h1>Platform Control Center</h1>
            <p id="date-display" style="color: var(--text-muted);"></p>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Mixes</div>
                <div class="stat-value" id="total-mixes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Likes</div>
                <div class="stat-value" id="total-likes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Downloads</div>
                <div class="stat-value" id="total-downloads">0</div>
            </div>
        </div>

        <!-- Add Mix Form -->
        <div class="card">
            <h3>Publish New Mix</h3>
            <form id="add-mix-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="mix-title">Mix Title *</label>
                        <input type="text" id="mix-title" placeholder="e.g. BASHMENT TOURS #summer_vibes" required>
                    </div>
                    <div class="form-group">
                        <label for="mix-audio">Audio Link (Dropbox/Supabase) *</label>
                        <input type="url" id="mix-audio" placeholder="Paste Dropbox link here..." required>
                    </div>
                    <div class="form-group">
                        <label for="mix-artwork">Artwork Link (Optional)</label>
                        <input type="url" id="mix-artwork" placeholder="Paste Dropbox image link (or leave blank for logo)">
                    </div>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-cloud-arrow-up"></i> Publish Mix</button>
            </form>
        </div>

        <!-- Mixes Table -->
        <div class="table-container">
            <h3 style="margin-top: 0; margin-bottom: 25px;">Live Catalog</h3>
            <table>
                <thead>
                    <tr>
                        <th>Artwork</th>
                        <th>Title</th>
                        <th>Likes</th>
                        <th>Downloads</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <tr><td colspan="5">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const API_URL = 'https://dj-grey.onrender.com/api'; 

        // Toggle Sidebar & Adjust Spacing
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        });

        document.getElementById('date-display').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Load data into stats & table
        async function loadAdminData() {
            try {
                const res = await fetch(`${API_URL}/mixes`);
                const mixes = await res.json();
                
                const tableBody = document.getElementById('admin-table-body');
                let totalLikes = 0;
                let totalDownloads = 0;
                
                tableBody.innerHTML = '';

                mixes.forEach(mix => {
                    totalLikes += mix.likes_count;
                    totalDownloads += mix.downloads_count;

                    tableBody.innerHTML += `
                        <tr>
                            <td><img src="${mix.artwork_url}" class="art-thumb" onerror="this.src='https://via.placeholder.com/45/1a1a20/ff0055?text=Art'"></td>
                            <td style="font-weight: bold;">${mix.title}</td>
                            <td><span class="badge"><i class="fa-solid fa-heart"></i> ${mix.likes_count}</span></td>
                            <td><span class="badge"><i class="fa-solid fa-download"></i> ${mix.downloads_count}</span></td>
                            <td>
                                <button class="btn-delete" onclick="deleteMix(${mix.id}, '${mix.title.replace(/'/g, "\\'")}')">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('total-mixes').innerText = mixes.length;
                document.getElementById('total-likes').innerText = totalLikes;
                document.getElementById('total-downloads').innerText = totalDownloads;

            } catch (error) {
                console.error("Error loading admin data:", error);
                document.getElementById('admin-table-body').innerHTML = `<tr><td colspan="5" style="color: var(--primary);">Failed to load database. Is the server running?</td></tr>`;
            }
        }

        // Add mix
        document.getElementById('add-mix-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('mix-title').value;
            const audio_url = document.getElementById('mix-audio').value;
            const artwork_url = document.getElementById('mix-artwork').value;

            try {
                const res = await fetch(`${API_URL}/mixes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, audio_url, artwork_url })
                });

                if (res.ok) {
                    alert('Mix published successfully!');
                    document.getElementById('add-mix-form').reset();
                    loadAdminData();
                } else {
                    alert('Failed to publish mix.');
                }
            } catch (err) {
                console.error("Error publishing mix:", err);
            }
        });

        // Delete mix
        async function deleteMix(id, title) {
            if (!confirm(`Are you sure you want to delete "${title}"?`)) return;

            try {
                const res = await fetch(`${API_URL}/mixes/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadAdminData();
                } else {
                    alert('Failed to delete mix.');
                }
            } catch (err) {
                console.error("Error deleting mix:", err);
            }
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
