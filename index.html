<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Grey | Official Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #1a1a20;
            --primary: #ff0055;
            --primary-glow: rgba(255, 0, 85, 0.6);
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --font-main: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            margin: 0; padding: 0; padding-bottom: 120px;
            background-color: var(--bg); color: var(--text-light); font-family: var(--font-main);
        }

        .hero {
            height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(rgba(10, 10, 12, 0.3), rgba(10, 10, 12, 1)), 
                        url('https://images.unsplash.com/photo-1571266028243-cb40fce75737?auto=format&fit=crop&w=1920&q=80') center/cover;
            text-align: center;
        }

        .hero h1 { font-size: 4rem; font-weight: 900; letter-spacing: 5px; text-shadow: 0 0 20px var(--primary-glow); margin: 0; }
        .hero p { color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }

        .container { max-width: 1280px; margin: 0 auto; padding: 40px 20px; }
        .section-title { font-size: 2rem; border-left: 5px solid var(--primary); padding-left: 15px; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-top: 20px; }
        
        .mix-card { background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; }
        .mix-card:hover { transform: translateY(-5px); }
        .mix-artwork { width: 100%; height: 250px; object-fit: cover; }
        .mix-content { padding: 20px; }
        .mix-title { font-size: 1.3rem; margin: 0 0 15px 0; }
        
        .card-actions { display: flex; justify-content: space-between; align-items: center; }
        button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
        .btn-play { background: var(--primary); color: #fff; padding: 10px 20px; border-radius: 30px; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn-play:hover { box-shadow: 0 0 15px var(--primary-glow); }
        
        .action-group { display: flex; gap: 15px; }
        .btn-icon { color: var(--text-muted); font-size: 1.1rem; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-icon:hover, .btn-like.liked { color: var(--primary); }

        /* Bottom Player */
        .audio-player {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
            background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(10px); border-top: 1px solid #2a2a35;
            display: flex; justify-content: space-between; align-items: center; padding: 0 40px; box-sizing: border-box; z-index: 1000;
        }
        .player-track-info { display: flex; align-items: center; gap: 15px; width: 300px; }
        .player-art { width: 55px; height: 55px; border-radius: 5px; object-fit: cover; background-color: #2a2a35; }
        .player-text h4 { margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .player-text p { margin: 0; font-size: 0.8rem; color: var(--text-muted); }
        
        .player-controls { display: flex; gap: 20px; align-items: center; margin: 0 auto; justify-content: center; }
        .play-pause-btn { font-size: 2.5rem; color: var(--primary); transition: 0.3s; }
        .play-pause-btn:hover { color: #fff; text-shadow: 0 0 10px var(--primary-glow); }
        
        .time-display { font-size: 0.9rem; color: var(--text-muted); min-width: 50px; font-variant-numeric: tabular-nums; }
        #time-current { text-align: right; }
        #time-remaining { text-align: left; }
    </style>
</head>
<body>

    <header class="hero">
        <h1>His Majesty DJ GREY</h1>
        <p>The Ultimate Experience</p>
    </header>

    <main class="container">
        <h2 class="section-title">Latest Drops</h2>
        <div class="grid" id="mixes-container">
            <p>Loading the heat...</p>
        </div>
    </main>

    <!-- Persistent Player -->
    <footer class="audio-player">
        <div class="player-track-info">
            <img src="https://www.dropbox.com/scl/fi/sn5sapl4pr1uzc98kcpez/dj_grey.jpeg?rlkey=72jldl168nvtccasr0ekk2qy2&st=3yyulxhl&raw=1" alt="Track Art" class="player-art" id="player-img">
            <div class="player-text">
                <h4 id="player-title">Select a Mix</h4>
                <p>DJ Grey</p>
            </div>
        </div>
        
        <div class="player-controls">
            <span class="time-display" id="time-current">0:00</span>
            <button class="btn-icon play-pause-btn" id="master-play"><i class="fa-solid fa-circle-play"></i></button>
            <span class="time-display" id="time-remaining">-0:00</span>
        </div>
        
        <div style="width: 300px;"></div> <!-- Spacer -->
    </footer>

    <script>
        const API_URL = 'http://localhost:3000/api';
        
        let currentAudio = new Audio();
        let isPlaying = false;

        // Elements
        const masterPlayBtn = document.getElementById('master-play');
        const playIcon = masterPlayBtn.querySelector('i');
        const playerTitle = document.getElementById('player-title');
        const playerImg = document.getElementById('player-img');
        const timeCurrentEl = document.getElementById('time-current');
        const timeRemainingEl = document.getElementById('time-remaining');

        // 1. Fetch Mixes on Load
        async function loadMixes() {
            try {
                const res = await fetch(`${API_URL}/mixes`);
                const mixes = await res.json();
                const container = document.getElementById('mixes-container');
                container.innerHTML = '';

                mixes.forEach(mix => {
                    const cardHTML = `
                        <article class="mix-card">
                            <img src="${mix.artwork_url}" class="mix-artwork" alt="${mix.title}" onerror="if(!this.dataset.tried){this.dataset.tried=true; this.src=this.src.endsWith('.jpg')?this.src.replace('.jpg','.jpeg'):this.src.replace('.jpeg','.jpg');}">
                            <div class="mix-content">
                                <h3 class="mix-title">${mix.title}</h3>
                                <div class="card-actions">
                                    <button class="btn-play" onclick="playMix('${mix.audio_url}', '${mix.title.replace(/'/g, "\\'")}', '${mix.artwork_url}')">
                                        <i class="fa-solid fa-play"></i> Play
                                    </button>
                                    <div class="action-group">
                                        <button class="btn-icon" onclick="downloadMix(${mix.id}, '${mix.audio_url}')">
                                            <i class="fa-solid fa-download"></i> <span id="dl-${mix.id}">${mix.downloads_count}</span>
                                        </button>
                                        <button class="btn-icon btn-like" onclick="likeMix(this, ${mix.id})">
                                            <i class="fa-solid fa-heart"></i> <span id="like-${mix.id}">${mix.likes_count}</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;
                    container.innerHTML += cardHTML;
                });
            } catch (err) {
                console.error("Error loading mixes", err);
            }
        }

        // 2. Play Audio Logic
        function playMix(audioUrl, title, artworkUrl) {
            playerTitle.innerText = title;
            playerImg.src = artworkUrl;
            
            currentAudio.src = audioUrl;
            currentAudio.play();
            isPlaying = true;
            updatePlayIcon();
        }

        masterPlayBtn.addEventListener('click', () => {
            if (!currentAudio.src) return;
            
            if (isPlaying) {
                currentAudio.pause();
            } else {
                currentAudio.play();
            }
            isPlaying = !isPlaying;
            updatePlayIcon();
        });

        function updatePlayIcon() {
            playIcon.className = isPlaying ? 'fa-solid fa-circle-pause' : 'fa-solid fa-circle-play';
        }

        // 3. Time Formatting & Live Updates
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        currentAudio.addEventListener('timeupdate', () => {
            timeCurrentEl.innerText = formatTime(currentAudio.currentTime);
            const remaining = currentAudio.duration - currentAudio.currentTime;
            timeRemainingEl.innerText = '-' + formatTime(remaining);
        });

        // 4. Like Logic
        async function likeMix(btn, id) {
            if (btn.classList.contains('liked')) return;
            btn.classList.add('liked');
            
            try {
                const res = await fetch(`${API_URL}/mixes/${id}/like`, { method: 'POST' });
                const data = await res.json();
                document.getElementById(`like-${id}`).innerText = data.newLikes;
            } catch (err) { console.error("Error liking", err); }
        }

        // 5. Download Logic
        async function downloadMix(id, url) {
            window.open(url, '_blank');
            
            try {
                const res = await fetch(`${API_URL}/mixes/${id}/download`, { method: 'POST' });
                const data = await res.json();
                document.getElementById(`dl-${id}`).innerText = data.newDownloads;
            } catch (err) { console.error("Error downloading", err); }
        }

        window.onload = loadMixes;
    </script>
</body>
</html>
