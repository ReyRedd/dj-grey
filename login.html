<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Grey | Secure Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <h2>DJ GREY</h2>
        <p id="form-subtitle">System Access</p>
        
        <div id="error-msg"></div>

        <form id="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            
            <div class="form-group" id="email-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="djgrey@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" id="submit-btn"><i class="fa-solid fa-lock"></i> Initialize</button>
        </form>

        <div class="toggle-mode" onclick="toggleRegisterMode()" id="mode-text">Request Access / Fan Register</div>
    </div>

    <script>
        const API_URL = 'https://dj-grey.onrender.com/api/auth';
        let isRegisterMode = false;

        function toggleRegisterMode() {
            isRegisterMode = !isRegisterMode;
            
            document.getElementById('submit-btn').innerHTML = isRegisterMode ? '<i class="fa-solid fa-user-plus"></i> Create Account' : '<i class="fa-solid fa-lock"></i> Initialize';
            document.getElementById('form-subtitle').innerText = isRegisterMode ? 'Register Fan Account' : 'System Access';
            document.getElementById('mode-text').innerText = isRegisterMode ? 'Back to Login' : 'Request Access / Fan Register';
            document.getElementById('error-msg').style.display = 'none';
            
            const emailGroup = document.getElementById('email-group');
            const emailInput = document.getElementById('email');
            
            if (isRegisterMode) {
                emailGroup.style.display = 'block';
                setTimeout(() => emailGroup.style.opacity = '1', 10);
                emailInput.required = true;
            } else {
                emailGroup.style.opacity = '0';
                setTimeout(() => emailGroup.style.display = 'none', 300);
                emailInput.required = false;
            }
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const errorMsg = document.getElementById('error-msg');

            const endpoint = isRegisterMode ? '/register' : '/login';
            
            const payload = { username, password };
            if (isRegisterMode) payload.email = email;

            try {
                document.getElementById('submit-btn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
                
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    errorMsg.innerText = data.error || 'Authentication failed.';
                    errorMsg.style.display = 'block';
                    document.getElementById('submit-btn').innerHTML = isRegisterMode ? '<i class="fa-solid fa-user-plus"></i> Create Account' : '<i class="fa-solid fa-lock"></i> Initialize';
                    return;
                }

                if (isRegisterMode) {
                    alert('Fan Account created! You can now log in.');
                    toggleRegisterMode();
                    document.getElementById('password').value = '';
                } else {
                    localStorage.setItem('dj_grey_token', data.token);
                    localStorage.setItem('dj_grey_user', data.username);
                    localStorage.setItem('dj_grey_role', data.role);
                    
                    if (data.role === 'admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/'; 
                    }
                }
            } catch (err) {
                errorMsg.innerText = 'Server communication error.';
                errorMsg.style.display = 'block';
                document.getElementById('submit-btn').innerHTML = isRegisterMode ? '<i class="fa-solid fa-user-plus"></i> Create Account' : '<i class="fa-solid fa-lock"></i> Initialize';
            }
        });
    </script>
</body>
</html>
