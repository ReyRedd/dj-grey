<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Grey | VIP Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Animated DJ Visualizer Background -->
    <div class="visualizer-bg">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-icon">
                <i class="fa-solid fa-compact-disc fa-spin" style="--fa-animation-duration: 4s;"></i>
            </div>
            <h2>DJ GREY</h2>
            <p id="form-subtitle" class="subtitle"> Welcome to Madness 🤪</p>
            
            <div id="error-msg" class="error-msg"></div>

            <form id="auth-form">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" required placeholder="Username">
                </div>
                
                <div class="input-group" id="email-group" style="display: none; opacity: 0; transition: opacity 0.3s ease;">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email Address">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required placeholder="Password">
                </div>

                <div class="input-group" id="confirm-password-group" style="display: none; opacity: 0; transition: opacity 0.3s ease;">
                    <i class="fa-solid fa-lock-open"></i>
                    <input type="password" id="confirm-password" placeholder="Confirm Password">
                </div>
                
                <button type="submit" class="btn" id="submit-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> Initialize 🔒
                </button>
            </form>

            <div class="social-login-container">
                <p class="social-text">Or continue with</p>
                <div class="social-buttons">
                    <!-- 🚨 ADDED type="button" TO PREVENT PAGE RELOAD -->
                    <button type="button" class="social-btn google" title="Google"><i class="fa-brands fa-google"></i></button>
                    <button type="button" class="social-btn apple" title="Apple / iCloud"><i class="fa-brands fa-apple"></i></button>
                    <button type="button" class="social-btn facebook" title="Facebook"><i class="fa-brands fa-facebook-f"></i></button>
                </div>
            </div>

            <div class="toggle-mode" onclick="toggleRegisterMode()" id="mode-text">
                No access? <span>Register</span>
            </div>
            
            <a href="/" class="back-home"><i class="fa-solid fa-arrow-left"></i> Go Back</a>
        </div>
    </div>

    <!-- Beautiful Success Modal -->
    <div id="success-modal" class="success-modal">
        <div class="success-content">
            <i class="fa-solid fa-headphones-simple headphones-icon"></i>
            <h3>Welcome to the VIP Experience</h3>
            <p style="color: #a0a0a0; font-size: 0.95rem; margin-bottom: 25px;">Your fan account is locked in. Get ready for the ultimate DJ Grey experience! 🎧</p>
            <button class="btn" onclick="closeModalAndLogin()">Log In 🔒</button>
        </div>
    </div>

    <!-- 🚨 ADDED SWEETALERT2 LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- 📦 LOAD MODULAR SCRIPT -->
    <script src="js/login.js"></script>
</body>
</html>
